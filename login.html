<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PinjamAlat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <div class="logo">Pinjam<span>Alat</span></div>
            <h2>Masuk ke Sistem</h2>
            <p>Gunakan akun Admin untuk demo</p>

            <form id="loginForm">
                <div class="input-group">
                    <label>Login Sebagai</label>
                    <select id="roleSelect" class="select-role" required>
                        <option value="" disabled selected>-- Pilih Role --</option>
                        <option value="admin">Administrator</option>
                        <option value="petugas">Petugas</option>
                        <option value="user">User</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="admin123" required>
                </div>

                <button type="submit" class="cta full-width">Masuk Sekarang</button>
            </form>
            
            <p class="footer-text">Belum punya akun? <a href="register.html">Daftar</a></p>
            <p class="footer-text"><a href="index.html">← Kembali ke Beranda</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const role = document.getElementById('roleSelect').value;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Logika Login Admin
            if (role === 'admin' && user === 'admin' && pass === 'admin123') {
                window.location.href = 'admin-dashboard.html';
            } else if (role === 'admin') {
                alert('Login Gagal! Gunakan user: admin & pass: admin123');
            } else {
                alert('Akses ' + role + ' belum tersedia. Silakan gunakan Admin.');
            }
        });
    </script>

</body>
</html>
